services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: barbichetz-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - barbichetz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (Object Storage)
  minio:
    image: minio/minio:latest
    container_name: barbichetz-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio/data
    command: server /minio/data --console-address ":9001"
    networks:
      - barbichetz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx API Gateway
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: barbichetz-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - kms-service
      - metadata-service
      - uploader-service
      - notification-service
      - frontend-app
    networks:
      - barbichetz-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: barbichetz-auth-service
    ports:
      - "8001:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - barbichetz-network
    restart: unless-stopped

  # KMS Service
  kms-service:
    build:
      context: ./services/kms-service
      dockerfile: Dockerfile
    container_name: barbichetz-kms-service
    ports:
      - "8002:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - barbichetz-network
    restart: unless-stopped

  # Metadata Service
  metadata-service:
    build:
      context: ./services/metadata-service
      dockerfile: Dockerfile
    container_name: barbichetz-metadata-service
    ports:
      - "8003:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8080
      KMS_SERVICE_URL: http://kms-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - barbichetz-network
    restart: unless-stopped

  # Uploader Service
  uploader-service:
    build:
      context: ./services/uploader-service
      dockerfile: Dockerfile
    container_name: barbichetz-uploader-service
    ports:
      - "8004:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: videos
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8080
      METADATA_SERVICE_URL: http://metadata-service:8080
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - barbichetz-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: barbichetz-notification-service
    ports:
      - "8005:8080"
    environment:
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    networks:
      - barbichetz-network
    restart: unless-stopped

  # Frontend App (Spring Boot + Thymeleaf)
  frontend-app:
    build:
      context: ./services/frontend-app
      dockerfile: Dockerfile
    container_name: barbichetz-frontend-app
    ports:
      - "8080:8080"
    environment:
      SPRING_BOOT_ENV: docker
      API_AUTH_URL: http://auth-service:8080
      API_METADATA_URL: http://metadata-service:8080
      API_UPLOADER_URL: http://uploader-service:8080
    depends_on:
      - auth-service
      - metadata-service
    networks:
      - barbichetz-network
    restart: unless-stopped

  # PhpMyAdmin (développement)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: barbichetz-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8888:80"
    depends_on:
      - mysql
    networks:
      - barbichetz-network

volumes:
  mysql_data:
  minio_data:

networks:
  barbichetz-network:
    driver: bridge